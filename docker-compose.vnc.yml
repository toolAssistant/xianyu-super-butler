services:
  xianyu-app:
    ports:
      - "127.0.0.1:${VNC_HOST_PORT:-5900}:5900"
      - "127.0.0.1:${NOVNC_HOST_PORT:-6080}:6080"
    volumes:
      - ./browser_data:/app/browser_data:rw
    environment:
      ENABLE_VNC: "true"
      VNC_SCREEN: ${VNC_SCREEN:-1980x1024x24}
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"
      VNC_PASSWORD_FILE: /run/secrets/vnc_password
    secrets:
      - source: vnc_password
        target: vnc_password

secrets:
  vnc_password:
    file: ${VNC_PASSWORD_FILE:-./data/vnc_password}
